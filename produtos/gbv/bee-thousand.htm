<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOME DO ÁLBUM | Guided by Noises</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../style.css">
</head>
<body class="fundo-site">

    <div class="ruido-overlay" aria-hidden="true"></div>

    <nav class="navbar navbar-expand-lg navbar-dark bg-menu borda-menu" id="navbar-principal">
        <div class="container">
            <a class="navbar-brand fw-bold tracking-wide" href="../../home.htm">
                GUIDED BY <span class="destaque-cor">NOISES</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto text-uppercase fw-semibold rotas-menu">
                    <li class="nav-item"><a class="nav-link" href="../../home.htm">Início</a></li>
                    <li class="nav-item"><a class="nav-link" href="../../catalogo.htm">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="../../sobre.htm">Sobre</a></li>
                    <li class="nav-item"><a class="nav-link" href="../../contato.htm">Contato</a></li>
                </ul>
                <div class="text-secondary">
                    <i class="fas fa-compact-disc fs-5 animacao-rodar"></i>
                </div>
            </div>
        </div>
    </nav>

    <div class="sidebar" id="sidebar">
        <button class="sidebar-toggle" id="toggleBtn" aria-label="Alternar menu">
            <i class="fas fa-chevron-right" id="toggleIcon"></i>
        </button>
        <nav class="sidebar-nav">
            <div class="sidebar-section">Parceiros</div>
            <a class="sidebar-item" href="https://www.sandyalexg.com" target="_blank">
                <i class="fas fa-external-link-alt"></i> Alex G
            </a>
            <a class="sidebar-item" href="https://www.guidedbyvoices.com" target="_blank">
                <i class="fas fa-external-link-alt"></i> Guided by Voices
            </a>
            <a class="sidebar-item" href="https://www.dinosaurjr.com" target="_blank">
                <i class="fas fa-external-link-alt"></i> Dinosaur Jr
            </a>
            <a class="sidebar-item" href="https://pigpenfan.netlify.app" target="_blank">
                <i class="fas fa-external-link-alt"></i> Peterc2
            </a>
        </nav>
    </div>

    <main class="container my-5 py-4">

        <!-- Voltar -->
        <a href="../../catalogo.htm" class="text-creme-mutado text-decoration-none small text-uppercase tracking-wider d-inline-block mb-4">
            <i class="fas fa-arrow-left me-2"></i> Voltar ao Catálogo
        </a>

        <div class="row g-5 align-items-start justify-content-center">

            <!-- CAPA -->
            <div class="col-12 col-md-5 col-lg-4">
                <div class="wrapper-capa position-relative overflow-hidden rounded">
                    <span class="tag-status position-absolute bg-vermelho">Último</span>
                    <img src="../../imagens/gbv/Bee Thousand.jpg" class="w-100 img-capa" alt="Capa LP">
                </div>
            </div>

            <div class="col-12 col-md-7 col-lg-5">
                <div class="card-disco card-alto p-4 rounded">

                    <span class="artista text-uppercase small d-block mb-1">Guided By Voices</span>

                    <h1 class="fw-black text-uppercase text-white mb-3" style="font-family: var(--fonte-display); font-size: 2rem;">
                        Bee Thousand
                    </h1>

                    <div style="border-top: 1px solid var(--linha);" class="pt-3 mt-2">
                        <p class="preco-cor fw-bold mb-4" style="font-size: 1.6rem;">R$ 95,00</p>

                        <a href="../../contato.htm" class="btn-enviar-contato text-uppercase fw-bold text-decoration-none d-block text-center py-3 rounded">
                            Tenho Interesse <i class="fas fa-paper-plane ms-2"></i>
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <footer class="bg-menu text-center py-4 small border-top border-dark text-secondary">
        <p class="m-0">&copy; 2026 Guided by Noises</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.getElementById('toggleBtn');
            const toggleIcon = document.getElementById('toggleIcon');

            let aberta = false;

            toggleBtn.addEventListener('click', function () {
                aberta = !aberta;
                sidebar.classList.toggle('aberta', aberta);
                toggleIcon.className = aberta ? 'fas fa-chevron-left' : 'fas fa-chevron-right';
            });
        });
    </script>
</body>
</html>
